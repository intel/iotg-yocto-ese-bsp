# for use with packagegroup-kernel-extras and packagegroup-kernel-oot
KERNEL_IMAGE_INSTALL:append = " linux-intel-iot-lts-rt-6.12"
KERNEL_PROVIDERS[6.12] += "linux-intel-iot-lts-rt-6.12"

INHERIT += "extra-kernels/rt"
MENDER_GRUBCONF_KERNELS_MENU[linux-intel-iot-lts-rt-6.12] = "linux-intel-iot-lts-rt-6.12-kernel"
MENDER_GRUBCONF_KERNELS[linux-intel-iot-lts-rt-6.12-kernel] = "${RT_KERNEL_COMMON_ARGS} i915.enable_guc=3 i915.max_vfs=7"
